<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purnell Motors - AI Voice Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    
    <!-- Title Header -->
    <header class="header">
      <h1>Purnell Motors Voice Agent</h1>
      <p class="subtitle">Select a voice model, enter the caller phone number, then start the agent</p>
    </header>

    <!-- Caller CLI Settings Section -->
    <section class="cli-card">
      <div class="cli-input-group">
        <label for="voiceModel" class="cli-label">Voice model:</label>
        <select id="voiceModel" class="cli-input voice-model-select">
          <option value="pipeline">Current pipeline (Deepgram + OpenAI + ElevenLabs)</option>
          <option value="gpt-live-1">OpenAI GPT-Live-1 (speech-to-speech)</option>
        </select>
      </div>
      <div class="cli-input-group">
        <label for="cliInput" class="cli-label">Incoming Phone Number (CLI):</label>
        <input 
          type="tel" 
          id="cliInput" 
          class="cli-input" 
          placeholder="e.g. 0412000006 or 0285580007" 
          value="0412000006"
          autocomplete="off"
        />
      </div>
      <div class="cli-preview">
        Normalized CLI (Sent to Agent): <span id="normalizedBadge" class="normalized-badge">+61412000006</span>
      </div>
    </section>

    <!-- Main Control Section: Big Play Button -->
    <section class="controls-card">
      <button id="playBtn" class="play-button">
        <svg id="playIcon" class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span id="playBtnText">Start Voice Agent</span>
      </button>

      <div id="statusBadge" class="status-badge idle">
        <span class="status-dot"></span>
        <span id="statusText">Ready to start</span>
      </div>
    </section>

    <!-- Scrollable Transcript Feed (Below the button) -->
    <section class="transcript-section">
      <div class="transcript-header">
        <h2>Conversation Transcript</h2>
        <button id="clearBtn" class="clear-btn">Clear Log</button>
      </div>

      <div id="transcriptBox" class="transcript-box">
        <div class="placeholder-text" id="placeholder">
          Click "Start Voice Agent" above to initiate the call...
        </div>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
